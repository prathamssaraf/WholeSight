name: whole_sight
description: AI-Enhanced Nutrition & Health Assistant that balances automation with user control.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # UI
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9
  google_fonts: ^6.1.0
  shimmer: ^3.0.0
  lottie: ^2.7.0
  fl_chart: ^0.65.0
  dartz: ^0.10.1

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  provider: ^6.1.1

  # Firebase
  firebase_core: ^2.32.0
  firebase_auth: ^4.20.0
  cloud_firestore: ^4.17.5
  firebase_storage: ^11.5.6
  firebase_analytics: ^10.7.4
  firebase_crashlytics: ^3.4.8

  # AI & ML
  google_generative_ai: ^0.4.6  # For Gemini
  image: ^4.1.3
  tflite_flutter: ^0.10.4
  camera: ^0.10.5+5

  # Network
  dio: ^5.4.0
  http: ^1.1.0
  connectivity_plus: ^5.0.2
  cached_network_image: ^3.3.0

  # Local Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.1

  # Utils
  intl: ^0.19.0
  uuid: ^4.2.2
  logger: ^2.0.2
  url_launcher: ^6.2.2
  permission_handler: ^11.1.0
  json_annotation: ^4.8.1

  # Barcode scanning
  mobile_scanner: ^3.5.2
  
  # Voice input
  speech_to_text: ^6.5.1
  get_it: ^8.0.3
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.4
  flutter_dotenv: ^5.2.1
  flutter_barcode_scanner: ^2.0.0
  image_picker: ^1.1.2
  syncfusion_flutter_charts: ^20.4.54
  syncfusion_flutter_core: ^20.4.54

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1
  mockito: ^5.4.2
  bloc_test: ^9.1.5
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.8
  flutter_svg: ^2.0.17

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - .env
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700